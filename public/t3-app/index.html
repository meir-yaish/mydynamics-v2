<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2733;--mute:#6b7785;--line:#dde3ea;--brand:#0b5cab;--ok:#1e9e5a;--prog:#e8a317;--no:#c9d1da;--bad:#d64545}
@media (prefers-color-scheme:dark){:root{--bg:#12171d;--card:#1a2129;--ink:#e6ebf0;--mute:#93a0ad;--line:#2b3540;--brand:#5ba3ee;--no:#3a4551}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif;font-size:14px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 14px;border-radius:6px;cursor:pointer;color:var(--mute);font:inherit}
nav button.on{background:var(--brand);color:#fff}
.sp{flex:1}
button.act,label.act,a.act{text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit}
main{padding:20px;max-width:1400px;margin:auto}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi b{display:block;font-size:26px;margin-top:4px}
.kpi span{color:var(--mute)}
.bar{height:10px;background:var(--no);border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .d{background:var(--ok)}.bar .p{background:var(--prog)}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:57px;background:var(--card);color:var(--mute);font-weight:600;z-index:2}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px}
.st{width:34px;height:24px;border-radius:5px;border:0;cursor:pointer;background:var(--no);color:#fff;font-weight:700}
.st.s1{background:var(--prog)}.st.s2{background:var(--ok)}
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
input.n{width:90px}
.late{color:var(--bad);font-weight:600}
.gantt{position:relative;height:18px;min-width:420px;background:var(--bg);border-radius:4px}
.gantt i{position:absolute;top:3px;height:12px;border-radius:3px;background:var(--brand);opacity:.85}
.gantt u{position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
.leg{color:var(--mute);font-size:12px;margin:6px 0}
.tot td{font-weight:700;background:var(--bg)}
.hide{display:none}
h2{font-size:16px;margin:0 0 10px}
.zr{border-top:1px solid var(--line);padding:10px 0}
.zr input.zn{width:100%}
.zr select{font-size:13px;max-width:100%}
</style>
</head>

if((S.boqv||0)<2){const old=new Map(S.boq.filter(r=>!r.hdr).map(r=>[r.no,r]));S.boq=BOQ.map(r=>{if(r.hdr)return r;const o=old.get(r.no);return o?{...r,done:o.done||0}:r});S.boqv=2;save()}

// תאריכי זיגוג מתוכננים מהזמנת הזכוכית - רק היכן שעוד לא הוזנו
S.pk.forEach(p=>{const g=GLASS.zones[p.task];if(g&&g.start&&!p.start){p.start=g.start;p.end=g.end}});

const fmt=n=>Math.round(n).toLocaleString('he-IL');
const pct=n=>(n*100).toFixed(1)+'%';
const W={0:0,1:.5,2:1};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const zArea=pts=>{let x=0,y=0,z=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];x+=(a[1]-b[1])*(a[2]+b[2]);y+=(a[2]-b[2])*(a[0]+b[0]);z+=(a[0]-b[0])*(a[1]+b[1])}return Math.hypot(x,y,z)/2};

  <div class="tw"><table><tr><th>משימה</th><th>תת-התקנה</th><th>בניין</th><th>חזית</th><th>קומות</th><th>פיגומים</th>${STAGES.map(s=>`<th>${s[1]}</th>`).join('')}<th>%</th></tr>
  ${P.map(p=>`<tr><td>${p.task}</td><td>${p.sub}</td><td>${p.bld}</td><td>${p.facade}</td><td>${p.floors}</td><td>${p.scaf}</td>
    ${STAGES.map(([k])=>`<td><button class="st s${p.st[k]}" data-p="${p.id}" data-k="${k}">${['','◐','✓'][p.st[k]]}</button></td>`).join('')}

  fb.onchange=()=>{f.bld=fb.value;save();track()};ff.onchange=()=>{f.fac=ff.value;save();track()};

    const p=S.pk.find(x=>x.id==b.dataset.p),k=b.dataset.k;p.st[k]=(p.st[k]+1)%3;save();track();

// ---------- תוכנית ביצוע זכוכית ----------
const PL_ST=['לא סופק','סופק לאתר','הותקן'];
const ST_C=['#c9d1da','#e8a317','#1e9e5a'];
const PSHORT=t=>t.replace(/^GL01-TYP-/,'').replace(/^GL04-TYP-/,'4·');
const pst=i=>(S.pc&&S.pc[i])||0;
function setPst(i,v){S.pc=S.pc||{};if(v)S.pc[i]=v;else delete S.pc[i]}
function plKey(r){return r[6]+'|'+(r[2]==='-'?'':r[2])}
// מסנכרן את שלב "זיגוג" בלשונית המעקב לפי סטטוס המשבצות
function syncGlassStage(){
  const a={};
  GLASSPLAN.forEach((r,i)=>{const k=plKey(r),s=pst(i);const o=a[k]=a[k]||{n:0,sup:0,ins:0};o.n++;if(s>0)o.sup++;if(s===2)o.ins++});
  S.pk.forEach(p=>{const o=a[p.sub.replace(',','.')+'|'+p.bld];if(o)p.st.glass=o.ins===o.n?2:o.sup>0?1:0});
}
const zoneNum=z=>{const [a,b]=z.split('.');return +a*100+ +b};
const zoneColor=(z,zs)=>`hsl(${(zs.indexOf(z)*47)%360} 60% 55%)`;
function plan(){
  const f=S.pf=S.pf||{fac:'',zone:'',mode:'status'};
  const zs=[...new Set(GLASSPLAN.map(r=>r[6]))].sort((a,b)=>zoneNum(a)-zoneNum(b));
  const facs=[...new Map(GLASSPLAN.map(r=>[r[0],r[1]])).entries()].sort((a,b)=>a[0]-b[0]);
  const match=r=>(!f.fac||r[0]==f.fac)&&(!f.zone||r[6]===f.zone);
  const tot=GLASSPLAN.length,sup=GLASSPLAN.filter((r,i)=>pst(i)>0).length,ins=GLASSPLAN.filter((r,i)=>pst(i)===2).length;
  const Z={};
  GLASSPLAN.forEach((r,i)=>{const k=plKey(r);const o=Z[k]=Z[k]||{z:r[6],tw:r[2],facs:new Set(),fl:new Set(),n:0,sup:0,ins:0};o.facs.add(r[1]);o.fl.add(r[3]);o.n++;if(pst(i)>0)o.sup++;if(pst(i)===2)o.ins++});
  const zrows=Object.values(Z).sort((a,b)=>zoneNum(a.z)-zoneNum(b.z)||a.tw.localeCompare(b.tw));
  const T={};
  GLASSPLAN.forEach((r,i)=>{const o=T[r[5]]=T[r[5]]||{n:0,sup:0,ins:0};o.n++;if(pst(i)>0)o.sup++;if(pst(i)===2)o.ins++});
  const bar=(s,i,n)=>`<div class="bar"><i class="d" style="width:${n?i/n*100:0}%"></i><i class="p" style="width:${n?(s-i)/n*100:0}%"></i></div>`;
  M.innerHTML=`<div class="grid kpis" style="margin-bottom:14px">
    <div class="card kpi"><span>משבצות זכוכית</span><b>${fmt(tot)}</b></div>
    <div class="card kpi"><span>סופקו לאתר</span><b>${fmt(sup)}</b><span>${pct(sup/tot)}</span></div>
    <div class="card kpi"><span>הותקנו</span><b>${fmt(ins)}</b><span>${pct(ins/tot)}</span>${bar(sup,ins,tot)}</div></div>
  <div class="toolbar">
    <select id="pFac"><option value="">כל החזיתות</option>${facs.map(([p,n])=>`<option value="${p}" ${f.fac==p?'selected':''}>${n}</option>`).join('')}</select>
    <select id="pZone"><option value="">כל הקבוצות</option>${zs.map(z=>`<option ${f.zone===z?'selected':''}>${z}</option>`).join('')}</select>
    <select id="pMode"><option value="status">צבע לפי סטטוס</option><option value="zone" ${f.mode==='zone'?'selected':''}>צבע לפי קבוצה</option></select>
    <button class="act" id="pAll">סמן סינון כהותקן</button><button class="act" id="pSup">סמן סינון כסופק</button><button class="act" id="pClr">אפס סינון</button>
    <span class="leg">קליק על משבצת: לא סופק ← סופק ← הותקן</span></div>
  <div id="pGrid"></div>
  <h2 style="margin-top:20px">לפי קבוצה</h2>
  <div class="tw"><table><tr><th>קבוצה</th><th>מגדל</th><th>חזיתות</th><th>קומות</th><th>יחידות</th><th>סופקו</th><th>הותקנו</th><th style="min-width:140px">התקדמות</th></tr>
  ${zrows.map(o=>{const fs=[...o.fl].filter(Boolean).sort((a,b)=>a-b);return `<tr class="zr" data-z="${o.z}" style="cursor:pointer"><td><b>${o.z}</b></td><td>${o.tw==='-'?'':o.tw}</td><td style="white-space:normal">${[...o.facs].join(', ')}</td><td>${fs[0]}-${fs[fs.length-1]}</td><td>${o.n}</td><td>${o.sup}</td><td>${o.ins}</td><td>${bar(o.sup,o.ins,o.n)}</td></tr>`}).join('')}</table></div>
  <h2 style="margin-top:20px">לפי סוג זכוכית (להזמנה)</h2>
  <div class="tw"><table><tr><th>סוג</th><th>כמות בתוכנית</th><th>סופקו</th><th>הותקנו</th></tr>
  ${Object.entries(T).sort().map(([t,o])=>`<tr><td>${t}</td><td>${o.n}</td><td>${o.sup}</td><td>${o.ins}</td></tr>`).join('')}</table></div>
  <p class="leg">מקור: תוכנית זכוכית 330_IM_SD1_GLASS_REV03 ושיוך הקבוצות לפי הסימון בסריקה. הפיצול בחזיתות הפנים ובקומות הגבוהות מבוסס על הערכת מיקום הקווים.</p>`;
  // רשת חזיתות
  const grid=document.getElementById('pGrid');
  grid.innerHTML=facs.filter(([p])=>!f.fac||p==f.fac).map(([p,name])=>{
    const cells=GLASSPLAN.map((r,i)=>[r,i]).filter(([r])=>r[0]==p);
    const cols=[...new Set(cells.map(([r])=>Math.round(r[4]/8)))].sort((a,b)=>a-b);
    const fl=[...new Set(cells.map(([r])=>r[3]))].sort((a,b)=>b-a);
    const at={};cells.forEach(([r,i])=>{at[r[3]+'_'+Math.round(r[4]/8)]=[r,i]});
    const tw=cells[0][0][2];
    return `<div class="card" style="margin-bottom:12px;overflow:auto"><b>${name}</b> <span class="leg">${tw==='-'?'מרפסת':'מגדל '+tw}</span>
    <div style="direction:ltr;display:grid;grid-template-columns:30px repeat(${cols.length},34px);gap:3px;margin-top:8px;width:max-content">
    ${fl.map(L=>`<div class="leg" style="align-self:center">L${L}</div>`+cols.map(c=>{
      const e=at[L+'_'+c];if(!e)return '<div></div>';
      const [r,i]=e,s=pst(i),on=match(r);
      const bg=f.mode==='zone'?zoneColor(r[6],zs):ST_C[s];
      const ring=f.mode==='zone'&&s===2?'box-shadow:inset 0 0 0 2px #fff;':'';
      return `<button class="st pc" data-i="${i}" title="${r[5]} · קבוצה ${r[6]} · קומה ${r[3]} · ${PL_ST[s]}" style="width:34px;height:26px;font-size:10px;padding:0;background:${bg};${ring}opacity:${on?(f.mode==='zone'&&s<2?.7:1):.18}" ${on?'':'disabled'}>${f.mode==='zone'?r[6]:PSHORT(r[5])}</button>`}).join('')).join('')}
    </div></div>`}).join('');
  const rerender=()=>{const y=scrollY;syncGlassStage();save();plan();scrollTo(0,y)};
  grid.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;setPst(i,(pst(i)+1)%3);rerender()});
  pFac.onchange=()=>{f.fac=pFac.value;save();plan()};
  pZone.onchange=()=>{f.zone=pZone.value;save();plan()};
  pMode.onchange=()=>{f.mode=pMode.value;save();plan()};
  const bulk=(v,label)=>{
    const idx=GLASSPLAN.map((r,i)=>i).filter(i=>match(GLASSPLAN[i]));
    if(!f.fac&&!f.zone&&!confirm(label+' לכל '+idx.length+' המשבצות?'))return;
    idx.forEach(i=>setPst(i,v));rerender()};
  pAll.onclick=()=>bulk(2,'לסמן כהותקן');pSup.onclick=()=>bulk(1,'לסמן כסופק');pClr.onclick=()=>bulk(0,'לאפס');
  M.querySelectorAll('.zr').forEach(r=>r.onclick=()=>{f.zone=r.dataset.z;f.fac='';save();plan();scrollTo(0,0)});
}

// ---------- לוח זמנים ----------
function sched(){
  const P=S.pk,ds=P.flatMap(p=>[p.start,p.end]).filter(Boolean).map(d=>+new Date(d));
  const today=Date.now(),min=ds.length?Math.min(...ds,today):today,max=ds.length?Math.max(...ds,today):today+864e5*30,span=Math.max(max-min,864e5);
  const pos=d=>((+new Date(d)-min)/span*100);
  M.innerHTML=`<p class="leg">הזן תאריכי התחלה וסיום מתוכננים לכל תת-התקנה (או ייבא מלוח הזמנים ב-Excel). קו אדום = היום.</p>
  <div class="tw"><table><tr><th>משימה</th><th>תת-התקנה</th><th>בניין</th><th>חזית</th><th>התחלה</th><th>סיום</th><th>%</th><th>סטטוס</th><th style="min-width:430px">ציר זמן</th></tr>
  ${P.map(p=>{
    const pr=pkProg(p),late=p.end&&pr<1&&+new Date(p.end)<today;
    return `<tr><td>${p.task}</td><td>${p.sub}</td><td>${p.bld}</td><td>${p.facade}</td>
      <td><input type="date" data-p="${p.id}" data-f="start" value="${p.start}"></td>
      <td><input type="date" data-p="${p.id}" data-f="end" value="${p.end}"></td>
      <td>${pct(pr)}</td><td class="${late?'late':''}">${pr===1?'הושלם':late?'באיחור':pr>0?'בעבודה':'טרם התחיל'}</td>
      <td><div class="gantt">${p.start&&p.end?`<i style="right:${pos(p.start)}%;width:${Math.max(1,pos(p.end)-pos(p.start))}%"></i>`:''}<u style="right:${pos(today)}%"></u></div></td></tr>`}).join('')}
  </table></div>`;
  M.querySelectorAll('input[type=date]').forEach(i=>i.onchange=()=>{S.pk.find(x=>x.id==i.dataset.p)[i.dataset.f]=i.value;save();sched()});
}

// ---------- Revit ----------
function rev(){
  const R=S.rev;
  M.innerHTML=`<div class="card"><h2>ייבוא Schedule מ-Revit</h2>
    <p class="leg">ייצא Schedule מ-Revit ל-Excel או CSV (Curtain Panels / Mullions / דלתות) והעלה כאן. אחר כך בחר עמודת קיבוץ ועמודת סכום כדי לראות כמויות לפי קומה, חזית או טיפוס.</p>

    ${R?`<div id="revBody" style="margin-top:14px"></div>`:''}`;
  fRev.onchange=async e=>{

  }
  function zList(){
    const tasks=S.pk.map(p=>`<option value="${esc(p.task)}">${esc(p.task)} · ${p.bld} ${esc(p.facade)} ק׳${esc(p.floors)}</option>`).join('');
    const rows=Z.map(z=>{const pk=S.pk.find(p=>p.task===z.task);
      return `<div class="zr" data-z="${z.id}">
        <div style="display:flex;gap:6px;align-items:center"><input class="zn" value="${esc(z.name)}" style="flex:1;min-width:0"><button class="act zf" title="מרכז מצלמה על האזור">⌖</button><button class="act zd" title="מחק אזור">🗑</button></div>
        <div style="display:flex;gap:6px;margin-top:6px"><select class="zy"><option value="zone" ${z.type==='zone'?'selected':''}>אזור עבודה</option><option value="pkg" ${z.type==='pkg'?'selected':''}>חבילת עבודה</option></select>
        <select class="zk" style="flex:1;min-width:0"><option value="">— ללא קישור למשימה —</option>${tasks.replace(`value="${esc(z.task)}"`,`value="${esc(z.task)}" selected`)}</select></div>
        <div class="leg">${f1(zArea(z.pts))} מ"ר${pk?` · התקדמות ${pct(pkProg(pk))}`:''}</div></div>`}).join('');
    zl.innerHTML=`<h2>אזורי עבודה וחבילות (${Z.length})</h2><div id="zst" class="leg"></div>
      <div id="zbt" style="display:none;gap:6px;flex-wrap:wrap;margin-bottom:8px"><button class="act" id="zOk">✓ סגור אזור</button><button class="act" id="zUndo">↶ נקודה אחרונה</button><button class="act" id="zCan">ביטול</button></div>
      ${rows||'<div class="leg">עדיין לא סומנו אזורים.</div>'}${Z.length?`<div class="leg">סה"כ ${f1(Z.reduce((a,z)=>a+zArea(z.pts),0))} מ"ר</div>`:''}`;
    zl.querySelectorAll('.zr').forEach(r=>{const z=Z.find(x=>x.id===r.dataset.z);
      r.querySelector('.zn').onchange=e=>{z.name=e.target.value.trim()||z.name;save()};
      r.querySelector('.zy').onchange=e=>{z.type=e.target.value;save();zBuild()};
      r.querySelector('.zk').onchange=e=>{z.task=e.target.value;save();zList()};
      r.querySelector('.zf').onclick=()=>zFocus(z);
      r.querySelector('.zd').onclick=()=>{if(confirm('למחוק את "'+z.name+'"?')){Z.splice(Z.indexOf(z),1);save();zBuild();zList()}};
    });
    zOk.onclick=zClose;zUndo.onclick=()=>{cur.pop();zCur();zStatus()};zCan.onclick=()=>{cur=[];zCur();zStatus()};
    zStatus();
  }
  function zKey(e){
    if(!drawMode||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName||''))return;
    if(e.key==='Enter')zClose();
    else if(e.key==='Escape'){if(cur.length){cur=[];zCur();zStatus()}else zMode(false)}
    else if(e.key==='Backspace'){e.preventDefault();cur.pop();zCur();zStatus()}
  }
  function zSync(){zg.visible=real.visible&&zShow.checked;dg.visible=real.visible;zl.style.display=real.visible?'':'none';fc.style.display=real.visible?'':'none';if(!real.visible&&drawMode)zMode(false);if(!real.visible)rd.clippingPlanes=[]}
  zBtn.onclick=()=>zMode(!drawMode);zShow.onchange=zSync;document.addEventListener('keydown',zKey);
  zBuild();zList();

  // ----- חזיתות: סיבוב המצלמה לחזית; חזית פנים מוצגת בחתך (צפון הפרויקט = כיוון 60° בצירי Revit; A מזרח ישר, B מערב מוטה) -----
  const NC=Math.cos(Math.PI/3),NS=Math.sin(Math.PI/3),V_CUT=84.5;
  const DIR={N:[NC,NS],S:[-NC,-NS],E:[NS,-NC],W:[-NS,NC]},TW={A:[-77.8,10.6],B:[-101.7,28.6]};
  const FAC=[['A','N','צפון'],['A','S','דרום'],['A','E','מזרח'],['A','W','מערב פנים','low'],['B','N','צפון'],['B','S','דרום'],['B','W','מערב'],['B','E','מזרח פנים','high']];
  let facKey='',flyT=0;
  function fly(pos,tgt){
    const p0=cam.position.clone(),t0=ctl.target.clone(),t1=performance.now();cancelAnimationFrame(flyT);
    const step=now=>{const k=Math.min(1,(now-t1)/700),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      cam.position.lerpVectors(p0,pos,e);ctl.target.lerpVectors(t0,tgt,e);ctl.update();if(k<1)flyT=requestAnimationFrame(step)};
    flyT=requestAnimationFrame(step);
  }
  function fSection(side){
    rd.clippingPlanes=side==='low'?[new THREE.Plane(new THREE.Vector3(NS,0,NC),V_CUT)]:side==='high'?[new THREE.Plane(new THREE.Vector3(-NS,0,-NC),-V_CUT)]:[];
  }
  function fGo(f){
    const c=TW[f[0]],d=DIR[f[1]],D=100;
    fSection(f[3]||'');facKey=f[0]+f[1];
    fly(new THREE.Vector3(c[0]+d[0]*D,26,-(c[1]+d[1]*D)),new THREE.Vector3(c[0],14,-c[1]));fBtns();
  }
  function fAll(){facKey='';fSection('');fly(REAL.cam.pos.clone(),REAL.cam.target.clone());fBtns()}
  function fBtns(){
    const cur=FAC.find(f=>f[0]+f[1]===facKey);
    fc.innerHTML='<h2>חזיתות</h2><div class="leg">לחץ על חזית כדי להסתובב אליה. חזית פנים מוצגת בחתך.</div>'+
      [['A','בניין A · מזרח'],['B','בניין B · מערב']].map(([tw,t])=>`<div style="margin:8px 0 4px;font-weight:600">${t}</div><div style="display:flex;gap:6px;flex-wrap:wrap">`+
        FAC.filter(f=>f[0]===tw).map(f=>`<button class="act fb" data-k="${f[0]+f[1]}" style="${facKey===f[0]+f[1]?'background:var(--brand);color:#fff;border-color:var(--brand)':''}">${f[2]}${f[3]?' · חתך':''}</button>`).join('')+'</div>').join('')+
      `<div style="margin-top:10px"><button class="act" id="fAll">מבט כללי</button></div>`+
      `<div class="leg">${cur&&cur[3]?'חתך: המגדל שמול החזית מוסתר כדי לראות אותה.':''}</div>`;
    fc.querySelectorAll('.fb').forEach(b=>b.onclick=()=>fGo(FAC.find(f=>f[0]+f[1]===b.dataset.k)));
    document.getElementById('fAll').onclick=fAll;
  }
  if(hasReal)fBtns();else fc.style.display='none';

  vm.onchange=()=>{S.v3mode=vm.value;save();v3d()};
  vv.value=hasReal?(S.v3view||'real'):'sch';vv.disabled=!hasReal;
  const applyView=()=>{S.v3view=vv.value;const r=vv.value==='real';sch.visible=!r;grid.visible=!r;real.visible=r;vcats.style.display=r?'flex':'none';zt.style.display=r?'flex':'none';zSync();save()};
  vv.onchange=applyView;applyView();

  // טעינת מודל אמיתי
  fGlb.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    new THREE.GLTFLoader().load(URL.createObjectURL(f),g=>{
      const o=g.scene,box=new THREE.Box3().setFromObject(o),sz=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());
      const k=120/Math.max(sz.x,sz.y,sz.z);o.scale.setScalar(k);o.position.sub(c.multiplyScalar(k));o.position.y+=sz.y*k/2;
      scene.add(o);sch.visible=false;real.visible=false;grid.visible=false;
    },undefined,()=>alert('לא ניתן לטעון את הקובץ'));
  };

  let alive=true;
  (function loop(){if(!alive)return;requestAnimationFrame(loop);ctl.update();rd.render(scene,cam)})();
  const onResize=()=>{const W2=el.clientWidth;rd.setSize(W2,h);cam.aspect=W2/h;cam.updateProjectionMatrix()};
  addEventListener('resize',onResize);
  stop3d=()=>{alive=false;removeEventListener('resize',onResize);document.removeEventListener('keydown',zKey);rd.dispose();rd.domElement.remove()};
}

// ---------- ייצוא / גיבוי ----------
bExp.onclick=()=>{
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.pk.map(p=>({משימה:p.task,'תת-התקנה':p.sub,בניין:p.bld,חזית:p.facade,קומות:p.floors,פיגומים:p.scaf,
    ...Object.fromEntries(STAGES.map(([k,t])=>[t,['לא בוצע','בתהליך','בוצע'][p.st[k]]])),אחוז:Math.round(pkProg(p)*100)/100,התחלה:p.start,סיום:p.end}))),'מעקב');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.boq.filter(r=>!r.hdr).map(r=>({סעיף:r.no,טיפוס:r.type,תיאור:r.desc,יחידה:r.unit,כמות:r.qty,מחיר:r.price,סהכ:r.total,מבוצע:r.done,שווי_שבוצע:r.qty?Math.round(r.price*Math.min(r.done,r.qty)):0}))),'כמויות');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(GLASSPLAN.map((r,i)=>({חזית:r[1],מגדל:r[2]==='-'?'מרפסת':r[2],קומה:r[3],קבוצה:r[6],סוג:r[5],סטטוס:PL_ST[pst(i)]}))),'תוכנית זכוכית');
  if((S.zones||[]).length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.zones.map(z=>({שם:z.name,סוג:z.type==='pkg'?'חבילת עבודה':'אזור עבודה',משימה:z.task,'שטח מ"ר':Math.round(zArea(z.pts)*10)/10,נקודות:z.pts.length}))),'אזורי עבודה');
  XLSX.writeFile(wb,'T3-Tracker-'+new Date().toISOString().slice(0,10)+'.xlsx');
};
bJson.onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download='T3-Tracker-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
};
fJson.onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{S=JSON.parse(await f.text());save();render()}catch(x){alert('קובץ לא תקין')}
};
render();
</script>
